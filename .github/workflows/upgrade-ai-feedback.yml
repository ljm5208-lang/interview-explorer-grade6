name: Upgrade AI Question Feedback

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  upgrade:
    if: "!contains(github.event.head_commit.message, '[ai-upgrade]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Upgrade question feedback
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          new_eval = r'''function evaluateQuestion(q){
 const s=q.trim();
 if(!s)return {kind:"empty",text:"질문을 입력해 보세요."};
 const lower=s.toLowerCase();
 const purpose=state.prepare.purpose || "선택한 면담 목적";
 const target=state.prepare.target || "면담 대상자";
 const personal=["주민등록","비밀번호","전화번호","주소","계좌","집 어디"];
 if(personal.some(k=>lower.includes(k))) return {kind:"sensitive",text:"개인정보를 묻는 질문은 피하는 것이 좋아요. 면담 목적과 꼭 필요한 관련이 있는지 먼저 생각해 보세요."};
 const fact=/어떤|무엇|무슨|몇|언제|어디|어떻게|과정|하는 일|업무|방법|준비/.test(lower);
 const feel=/생각|느끼|보람|힘들|마음|중요하|까닭|이유/.test(lower);
 const future=/앞으로|계획|목표|꿈|하고 싶|해 주고 싶은|당부/.test(lower);
 let type=fact?"구체적인 사실에 대한 질문":feel?"생각이나 느낌에 대한 질문":future?"앞으로의 계획이나 당부에 대한 질문":"질문의 유형을 더 생각해 볼 수 있어요.";
 const polite=/요?|나요?|까요?|주세요|주실|하나요|하셨나요|있나요|인가요|습니까|세요/.test(s);
 const clear=s.length<=100 && /[?？]/.test(s);
 if(!polite) return {kind:"revise",text:"내용은 보이지만, 면담 대상자가 편안하게 답할 수 있도록 공손한 표현으로 다듬어 보세요."};
 if(!clear) return {kind:"revise",text:"무엇을 알고 싶은지 조금 더 분명하게 드러내 보세요."};
 return {kind:"good",text:"질문의 형식은 잘 갖추었어요. 이제 답변을 들은 뒤 더 궁금한 점을 후속 질문으로 이어 가 보세요."};
}

async function evaluateQuestionAI(q){
 const fallback=evaluateQuestion(q);
 if(fallback.kind==="empty" || !q.trim()) return fallback;
 const purpose=state.prepare.purpose || "아직 정하지 않은 면담 목적";
 const target=state.prepare.target || "면담 대상자";
 const systemPrompt=`너는 초등학교 6학년 국어 수업에서 '좋은 면담 질문'을 코칭하는 AI 교사다.
학생이 쓴 질문을 실제로 읽고, 매번 질문 내용에 맞는 구체적인 피드백을 만들어야 한다.
절대로 정해진 칭찬 문장을 반복하지 마라.

평가 기준:
1. 면담 목적과 관련이 있는가?
2. 선택한 면담 대상자에게 물어볼 만한가?
3. 무엇을 알고 싶은지 분명한가?
4. 대상자가 이해하고 답하기 쉬운가?
5. 예의 있고 개인정보 침해 가능성이 적은가?
6. 단순한 예/아니오보다 구체적인 답을 이끌 수 있는가?
7. 질문이 사실/생각·느낌/앞으로의 계획·당부 중 무엇에 가까운지 판단한다.

면담 목적: ${purpose}
면담 대상자: ${target}

반드시 JSON 하나만 출력한다. 마크다운이나 코드블록을 사용하지 않는다.
형식:
{"kind":"good|revise|sensitive|off","type":"사실|생각이나 느낌|앞으로의 계획이나 당부|복합","text":"학생에게 보여 줄 2~4문장의 구체적인 피드백","strengths":["잘한 점"],"issues":["고칠 점"],"suggestion":"필요하면 질문을 더 좋게 만든 예시. 좋으면 빈 문자열"}

좋은 질문도 억지로 고치지 말고, 질문의 실제 단어와 의도를 언급해서 피드백하라.
`;

 try{
   const res=await fetch("https://interview-ai.jml5208.workers.dev/",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({
       message:q,
       history:[],
       systemPrompt
     })
   });
   if(!res.ok)throw new Error("AI proxy error");
   const data=await res.json();
   const raw=data.answer||data.message||data.content||"";
   let parsed=null;
   try{ parsed=JSON.parse(raw); }catch(_){
     const m=raw.match(/{[sS]*}/);
     if(m) try{parsed=JSON.parse(m[0])}catch(__){}
   }
   if(!parsed || !parsed.text)throw new Error("invalid AI JSON");
   return {
     kind:["good","revise","sensitive","off"].includes(parsed.kind)?parsed.kind:"revise",
     text:parsed.text,
     type:parsed.type||"",
     strengths:Array.isArray(parsed.strengths)?parsed.strengths:[],
     issues:Array.isArray(parsed.issues)?parsed.issues:[],
     suggestion:parsed.suggestion||""
   };
 }catch(err){
   return {...fallback, text:"AI 피드백을 연결하지 못해 기본 점검을 보여 줍니다. 잠시 후 다시 시도해 보세요.\n\n"+fallback.text, aiError:true};
 }
}

'''
          pattern = r'function evaluateQuestion(q){[sS]*?
}

function makeQuestions()'
          s2, n = re.subn(pattern, new_eval + 'function makeQuestions()', s, count=1)
          if n != 1:
              raise SystemExit("evaluateQuestion block not found")

          new_bind = r'''function bindMake(){
 document.querySelectorAll(".q-input").forEach(el=>el.addEventListener("input",e=>{
   state.questions[Number(e.target.dataset.qidx)]=e.target.value;save()
 }));
 document.getElementById("checkQuestions")?.addEventListener("click",async()=>{
   const btn=document.getElementById("checkQuestions");
   if(btn){btn.disabled=true;btn.textContent="AI가 질문을 살펴보는 중…";}
   state.questionChecks=state.questions.map(q=>({q,kind:"loading",text:"질문의 목적·대상·표현을 살펴보고 있어요…"}));
   save();render();

   const checks=await Promise.all(state.questions.map(q=>evaluateQuestionAI(q)));
   state.questionChecks=checks.map((r,i)=>({q:state.questions[i],...r}));
   save();render();
 });
}

'''
          pattern2 = r'function bindMake(){[sS]*?
}

function prepare()'
          s3, n2 = re.subn(pattern2, new_bind + 'function prepare()', s2, count=1)
          if n2 != 1:
              raise SystemExit("bindMake block not found")

          p.write_text(s3, encoding="utf-8")
          print("index.html upgraded")
          PY

      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Upgrade AI question feedback [ai-upgrade]"
          git push
