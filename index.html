<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>면담 탐험대 | 6학년 국어 2단원</title>
<style>
:root{
  --blue:#2563eb;--blue2:#1d4ed8;--sky:#eff6ff;--navy:#172554;
  --ink:#1f2937;--muted:#64748b;--line:#dbe4f0;--card:#fff;
  --green:#16a34a;--green-bg:#ecfdf3;--red:#dc2626;--red-bg:#fef2f2;
  --amber:#d97706;--amber-bg:#fffbeb;--purple:#7c3aed;--purple-bg:#f5f3ff;
  --shadow:0 10px 30px rgba(30,64,175,.09);--radius:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#f6f9fd;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.65}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1180px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:18px}
.brand{font-weight:900;color:var(--navy);white-space:nowrap}
.progress-wrap{flex:1}
.progress-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:5px}
.progress{height:9px;background:#e8eef7;border-radius:99px;overflow:hidden}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb);border-radius:99px;transition:.25s}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 11px;color:var(--muted)}
.shell{max-width:1180px;margin:auto;padding:28px 20px 70px}
.hero{background:linear-gradient(135deg,#eaf3ff,#fff);border:1px solid #d6e6ff;border-radius:30px;padding:38px;display:grid;grid-template-columns:1.25fr .75fr;gap:28px;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.05;margin:8px 0 14px;color:var(--navy);letter-spacing:-.04em}
.kicker{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #cfe0ff;color:var(--blue2);padding:6px 12px;border-radius:999px;font-weight:800;font-size:14px}
.hero p{font-size:18px;color:#475569;max-width:680px}
.hero-art{display:flex;align-items:center;justify-content:center;min-height:230px}
.explorer{width:210px;height:210px;border-radius:42% 58% 55% 45%;background:#fff;border:10px solid #bfdbfe;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px rgba(37,99,235,.15);font-size:92px;transform:rotate(-4deg)}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;min-height:46px;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 8px 18px rgba(37,99,235,.22)}
.btn-secondary{background:#fff;color:var(--blue2);border:1px solid #bfd5fb}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-danger{background:#fff;color:var(--red);border:1px solid #fecaca}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.section{margin-top:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.card h2,.card h3{margin-top:0;color:var(--navy);letter-spacing:-.02em}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left;min-height:145px;transition:.15s}
.tile:hover{border-color:#9ec3ff;box-shadow:0 8px 20px rgba(37,99,235,.08)}
.tile strong{display:block;font-size:18px;color:var(--navy);margin-bottom:5px}
.tile small{color:var(--muted)}
.stage-nav{display:flex;gap:8px;overflow:auto;padding:3px 2px 10px;margin:22px 0}
.stage-chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#64748b;border-radius:999px;padding:8px 13px;font-weight:700}
.stage-chip.active{background:#eaf2ff;border-color:#93c5fd;color:var(--blue2)}
.stage-chip.done{background:#ecfdf3;border-color:#bbf7d0;color:#15803d}
.stage-title{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin:10px 0 20px}
.stage-title h2{font-size:30px;line-height:1.2;margin:0;color:var(--navy)}
.stage-title p{margin:5px 0 0;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}
.badge-blue{background:#eaf2ff;color:#1d4ed8}.badge-green{background:#ecfdf3;color:#15803d}.badge-amber{background:#fffbeb;color:#b45309}.badge-purple{background:#f5f3ff;color:#6d28d9}
.callout{padding:15px 17px;border-radius:15px;background:var(--sky);border:1px solid #cfe0ff}
.callout strong{color:var(--navy)}
.step-list{display:grid;gap:10px}
.step{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start}
.step-num{width:34px;height:34px;border-radius:50%;background:#eaf2ff;color:var(--blue2);display:flex;align-items:center;justify-content:center;font-weight:900}
.step p{margin:0}
label{font-weight:800;color:#334155;font-size:14px;display:block;margin:0 0 6px}
input,textarea,select{width:100%;border:1px solid #cbd5e1;background:#fff;border-radius:12px;padding:11px 13px;outline:none;color:var(--ink)}
input:focus,textarea:focus,select:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.16)}
textarea{min-height:120px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.full{grid-column:1/-1}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.question-card{border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 14px;margin-top:9px}
.choice.correct{border-color:#86efac;background:#ecfdf3;color:#166534}
.choice.wrong{border-color:#fca5a5;background:#fef2f2;color:#991b1b}
.choice:disabled{cursor:default}
.feedback{margin-top:12px;border-radius:13px;padding:12px 14px;font-size:14px}
.feedback.good{background:var(--green-bg);color:#166534}
.feedback.hint{background:var(--amber-bg);color:#92400e}
.feedback.bad{background:var(--red-bg);color:#991b1b}
.type-card{border-top:5px solid #93c5fd}
.type-card h3{margin-bottom:6px}
.type-card p{margin:4px 0}
.sort-bank{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}
.sort-item{border:1px solid #cbd5e1;background:#fff;padding:10px 12px;border-radius:12px;font-weight:700}
.sort-item.selected{background:#eaf2ff;border-color:#60a5fa;color:#1d4ed8}
.type-targets{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.drop-target{min-height:120px;border:2px dashed #cbd5e1;border-radius:15px;padding:12px;background:#fafcff}
.drop-target h4{margin:0 0 7px;color:var(--navy)}
.drop-target .sort-item{font-size:13px;margin:4px 0}
.check-row{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:12px;border-radius:13px;background:#fff}
.check-row input{width:auto;margin-top:5px}
.role{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fbfdff}
.role strong{display:block;color:var(--navy)}
.chat{height:470px;overflow:auto;border:1px solid var(--line);border-radius:18px;background:#f8fafc;padding:16px;display:flex;flex-direction:column;gap:11px}
.msg{max-width:82%;padding:12px 14px;border-radius:17px;white-space:pre-wrap}
.msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.msg.user{align-self:flex-end;background:#2563eb;color:#fff}
.chat-meta{font-size:11px;color:var(--muted);margin-bottom:3px}
.chat-input{display:flex;gap:9px;margin-top:12px}
.chat-input textarea{min-height:58px;max-height:130px}
.persona-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.persona{border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px;text-align:left}
.persona.active{border:2px solid #60a5fa;background:#eff6ff}
.persona .emoji{font-size:28px}
.persona strong{display:block;color:var(--navy)}
.recommendations{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.reco{border:1px solid #c4b5fd;background:#faf5ff;color:#6d28d9;border-radius:999px;padding:8px 11px;font-size:13px}
.summary-box{background:#f8fafc;border:1px solid var(--line);border-radius:15px;padding:16px}
.report{border:1px solid #cbd5e1;border-radius:16px;padding:20px;background:#fff}
.report h4{margin:0 0 8px;color:var(--navy)}
.toast{position:fixed;right:20px;bottom:20px;z-index:50;background:#172554;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:none}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
hr{border:0;border-top:1px solid var(--line);margin:22px 0}
footer{margin-top:40px;text-align:center;color:#94a3b8;font-size:12px}
@media(max-width:900px){
 .hero{grid-template-columns:1fr}.hero-art{display:none}.grid-3,.type-targets{grid-template-columns:1fr}
 .persona-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){
 .shell{padding:18px 12px 50px}.topbar-inner{padding:10px 12px}.brand{display:none}
 .hero{padding:25px 20px;border-radius:22px}.hero h1{font-size:38px}.hero p{font-size:16px}
 .grid-2,.tiles,.form-grid{grid-template-columns:1fr}.full{grid-column:auto}
 .stage-title{display:block}.stage-title h2{font-size:25px}.chat{height:420px}
 .msg{max-width:90%}.actions .btn{flex:1}.persona-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast"></div>
<script>
"use strict";

const STORAGE_KEY = "interview-explorer-grade6-v1";

const stages = [
  {id:"meaning",label:"면담이란?"},
  {id:"process",label:"면담의 절차"},
  {id:"types",label:"질문 탐험"},
  {id:"make",label:"좋은 질문 만들기"},
  {id:"prepare",label:"면담 준비"},
  {id:"ai",label:"AI 가상 면담"},
  {id:"summary",label:"면담 정리"},
  {id:"report",label:"면담 보고서"},
  {id:"reflect",label:"돌아보기"},
  {id:"review",label:"나의 학습"}
];

const quiz = [
 {id:"q1",question:"면담은 무엇을 하기 위한 대화일까요?",choices:["특정 인물이나 주제의 정보를 수집하기 위해","상대방의 취미를 맞히기 위해","친구와 경쟁하기 위해","정답을 빨리 말하기 위해"],answer:0,explanation:"면담은 면담자가 특정 인물이나 주제의 정보를 수집하려고 면담 대상자와 주고받는 대화예요."},
 {id:"q2",question:"면담을 준비할 때 가장 알맞은 행동은 무엇일까요?",choices:["목적과 관계없는 자료도 많이 모은다","면담 목적에 맞는 대상자와 자료를 정하고 질문을 만든다","질문은 면담 현장에서 처음 생각한다","상대방에게 먼저 녹음을 알리지 않는다"],answer:1,explanation:"면담에는 목적과 관련된 자료를 찾고, 질문을 만들고, 대상자에게 예의 있게 요청하는 준비가 필요해요."},
 {id:"q3",question:"면담 대상자의 답변을 듣다가 더 궁금한 점이 생겼습니다. 어떻게 하면 좋을까요?",choices:["상대의 말을 바로 끊는다","처음 질문으로 돌아간다","답변을 들은 뒤 이어서 후속 질문을 한다","추천 질문만 선택한다"],answer:2,explanation:"후속 질문은 면담 대상자의 대답을 듣고 더 자세히 알려고 이어서 하는 질문이에요."},
 {id:"q4",question:"면담 내용을 녹음·녹화하려고 합니다. 먼저 해야 할 일은 무엇일까요?",choices:["인터넷에 올릴 준비를 한다","면담 대상자의 동의를 구한다","친구에게 파일을 보낸다","아무 말 없이 녹화한다"],answer:1,explanation:"면담 내용을 녹음·녹화할 때에는 먼저 면담 대상자의 동의를 구해야 해요."},
 {id:"q5",question:"면담 보고서의 가운데 부분에는 무엇을 중심으로 정리할까요?",choices:["면담으로 새롭게 안 사실","모둠원의 이름만","면담 전날의 일기","친구들의 순위"],answer:0,explanation:"가운데 부분에는 면담 대상자의 답변을 중심으로 면담으로 새롭게 안 사실을 정리해요."}
];

const personas = {
  librarian:{name:"사서",emoji:"📚",intro:"도서관에서 일하며 책과 자료를 찾고 이용하는 일을 돕는 가상의 사서입니다.",
    facts:["도서관 자료를 정리하고 이용자가 필요한 자료를 찾도록 돕습니다.","책뿐 아니라 여러 정보 자료를 살펴보고 이용자에게 알맞은 자료를 안내할 수 있습니다."],
    feelings:["사람이 원하는 자료를 찾아 주고 새로운 관심을 발견하도록 도울 때 보람을 느낄 수 있습니다.","자료를 정확하게 찾고 안내하려면 차분하게 듣고 생각하는 태도가 중요합니다."],
    future:["더 많은 사람이 도서관과 다양한 자료를 편리하게 이용하도록 돕고 싶습니다.","사서가 되고 싶은 학생이라면 책과 정보에 관심을 가지고 여러 자료를 탐색해 보는 것이 도움이 됩니다."]},
  firefighter:{name:"소방관",emoji:"🚒",intro:"화재와 재난 현장에서 사람의 안전을 돕는 가상의 소방관입니다.",
    facts:["화재를 진압하고 구조·구급 활동 등 사람의 안전을 돕는 일을 합니다.","현장에서는 정해진 절차에 따라 동료들과 협력하며 움직입니다."],
    feelings:["위험한 상황에서 사람을 안전하게 돕는 일이 중요하고 큰 책임이 따릅니다.","훈련한 대로 침착하게 행동하고 동료와 협력하는 태도가 중요합니다."],
    future:["재난에 더 안전하게 대응할 수 있는 방법을 계속 배우고 훈련하고 싶습니다.","소방관을 꿈꾼다면 안전과 협력에 관심을 가지고 체력을 기르며 다양한 상황에서 침착하게 행동하는 연습을 해 보는 것이 좋습니다."]},
  veterinarian:{name:"수의사",emoji:"🐾",intro:"동물의 건강을 살피는 가상의 수의사입니다.",
    facts:["동물의 상태를 살펴보고 질병을 예방하거나 치료하는 일을 합니다.","반려동물뿐 아니라 가축이나 야생 동물을 돌보는 경우도 있습니다."],
    feelings:["동물이 건강을 회복하는 데 도움을 줄 때 보람을 느낄 수 있습니다.","동물을 세심하게 관찰하고 보호자와도 차분하게 소통하는 태도가 중요합니다."],
    future:["동물의 건강과 복지를 더 잘 돕는 방법을 배우고 싶습니다.","수의사를 꿈꾼다면 동물과 생명에 관심을 가지고 관찰하고 기록하는 습관을 길러 보세요."]},
  robotics:{name:"로봇 공학자",emoji:"🤖",intro:"로봇을 설계하고 만드는 일을 하는 가상의 로봇 공학자입니다.",
    facts:["먼저 로봇이 어떤 문제를 해결해야 하는지 정한 뒤 형태와 기능을 설계하고 필요한 부품을 선택합니다.","프로그램을 만들고 여러 번 시험하면서 오류를 발견하고 문제를 수정합니다."],
    feelings:["여러 번 수정한 끝에 로봇이 제대로 작동하고 사람에게 도움이 될 때 보람을 느낄 수 있습니다.","기술뿐 아니라 로봇이 우리 생활에 미치는 영향도 생각하는 태도가 중요합니다."],
    future:["사람이 더 안전하고 편리하게 생활하도록 돕는 로봇을 만들고 싶습니다.","로봇 공학자가 되고 싶다면 로봇이나 기계가 어떻게 움직이는지 관심을 가지고 탐구해 보는 것이 좋습니다."]},
  counselor:{name:"상담 교사",emoji:"💬",intro:"학생들의 이야기를 듣고 학교생활을 돕는 가상의 상담 교사입니다.",
    facts:["학생들의 고민을 듣고 해결 방법을 찾을 수 있도록 돕습니다.","친구 관계, 공부, 가족 문제 등으로 힘들어하는 학생에게 필요한 도움을 안내할 수 있습니다."],
    feelings:["학생이 고민을 정리하고 학교생활을 편안하게 해 나가도록 도움을 줄 때 보람을 느낄 수 있습니다.","상대의 말을 끝까지 듣고 공감하며 차분하게 대화하는 태도가 중요합니다."],
    future:["학생들이 자신의 마음을 이해하고 필요한 도움을 받을 수 있도록 더 배우고 싶습니다.","상담 교사를 꿈꾼다면 다른 사람의 말을 잘 듣고 존중하는 연습을 해 보세요."]},
  athlete:{name:"운동선수",emoji:"🏃",intro:"운동을 꾸준히 훈련하는 가상의 운동선수입니다.",
    facts:["정해진 종목의 기술과 체력을 꾸준히 훈련하고 경기에서 자신의 기량을 발휘합니다.","훈련 내용을 기록하고 부족한 점을 찾아 반복해서 연습합니다."],

let state=loadState();

function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return freshState();
    const s=JSON.parse(raw), base=freshState();
    return deepMerge(base,s);
  }catch(e){return freshState()}
}
function deepMerge(base,src){
  if(!src || typeof src!=="object") return base;
  for(const k of Object.keys(base)){
    if(src[k]!==undefined){
      if(base[k] && typeof base[k]==="object" && !Array.isArray(base[k]) && typeof src[k]==="object") base[k]=deepMerge(base[k],src[k]);
      else base[k]=src[k];
    }
  }
  return base;
}
function save(){
  state.lastSaved=new Date().toISOString();
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(msg){
  const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove("show"),1900);
}
function pct(){
  const done=Object.values(state.completed).filter(Boolean).length;
  return Math.round(done/stages.length*100);
}
function complete(id){state.completed[id]=true;save()}
function setStage(i){state.stage=Math.max(0,Math.min(stages.length-1,i));save();render();window.scrollTo({top:0,behavior:"smooth"})}
function inputVal(sel){return document.querySelector(sel)?.value ?? ""}
function bind(selector,fn){
  document.querySelectorAll(selector).forEach(el=>el.addEventListener("input",fn));
}
function updateField(path,val){
  const parts=path.split(".");
  let obj=state;for(let i=0;i<parts.length-1;i++)obj=obj[parts[i]];
  obj[parts.at(-1)]=val;save();
}

function evaluateQuestion(q){
 const s=q.trim();
 if(!s)return {kind:"empty",text:"질문을 입력해 보세요."};
 const lower=s.toLowerCase();
 const purpose=state.prepare.purpose || "선택한 면담 목적";
 const target=state.prepare.target || "면담 대상자";
 const personal=["결혼","연애","월급","재산","주소","전화번호","가족관계","나이 몇","외모","집 어디","정치"];
 if(personal.some(k=>lower.includes(k))) return {kind:"sensitive",text:"상대방이 개인적인 정보를 말하기 불편할 수도 있어요. 면담 목적과 관련이 있는지, 상대가 편안하게 답할 수 있는지 먼저 생각해 볼까요?"};
 const off=["좋아하는 색","혈액형","게임 뭐","아이돌","누구 좋아","취미가 뭐"];
 if(off.some(k=>lower.includes(k)) && !/직업|일|면담|목적/.test(lower)) return {kind:"off",text:`이 질문이 '${purpose}'을/를 알아보는 데 도움이 되는지 생각해 보세요. 우리가 정말 알고 싶은 내용과 연결되는 질문일까요?`};
 const fact=/어떤|무엇|무슨|몇|언제|어디|어떻게|과정|하는 일|업무|방법|준비/.test(lower);
 const feel=/생각|느끼|보람|힘들|어떤 마음|중요하|까닭|이유/.test(lower);
 const future=/앞으로|계획|목표|꿈|하고 싶|해 주고 싶은|당부/.test(lower);
 let type=fact?"구체적인 사실에 대한 질문":feel?"생각이나 느낌에 대한 질문":future?"앞으로의 계획이나 당부에 대한 질문":"질문의 유형을 조금 더 생각해 볼 수 있어요.";
 const polite=/요\?|나요\?|까요\?|주세요|주실|하나요|하셨나요|있나요|인가요|습니까|세요/.test(s);
 const clear=s.length<=70 && /[?？]/.test(s);
 if(!polite) return {kind:"revise",text:"질문의 내용은 보이지만, 면담 대상자가 편안하게 답할 수 있도록 공손한 표현으로 다듬어 볼까요? 직접 더 좋은 표현을 만들어 보세요."};
 if(!clear) return {kind:"revise",text:"한 번에 알고 싶은 내용을 조금 더 분명하게 드러내면 좋아요. 대상자가 무엇을 답해야 하는지 생각해 보며 다시 써 보세요."};
 return {kind:"good",text:`좋은 질문이에요. ${type}에 해당하고, 면담 목적과 연결되는 내용을 물어보려는 의도가 보여요. 실제 면담에서는 답변을 잘 듣고 더 궁금한 점이 생기면 후속 질문으로 이어 갈 수 있어요.`};
}

function aiInterview(){

 const chat=state.chat;
 return `<div class="card"><div class="callout"><b>중요!</b> 지금부터는 실제 면담이 아니라 <b>실제 면담을 하기 전에 연습할 수 있도록 가상의 면담 대상자와 대화하는 활동</b>이에요. 특정 실제 인물의 경험을 대신하는 것이 아니에요.</div>
 <h2 style="margin-top:22px">가상 면담 대상자 선택</h2><div class="persona-grid">${Object.entries(personas).map(([k,v])=>`<button class="persona ${state.persona===k?"active":""}" data-persona="${k}"><span class="emoji">${v.emoji}</span><strong>${v.name}</strong><small class="muted">${v.intro.slice(0,34)}…</small></button>`).join("")}</div></div>
 <div class="section grid grid-2">

 <textarea id="opening" placeholder="예: 안녕하세요. 오늘 면담을 허락해 주셔서 감사합니다. 저희는 사서가 하는 일을 알아보기 위해 몇 가지 질문을 드리려고 합니다. 녹음을 해도 괜찮을까요?">${state.interviewStarted?esc(state._opening||""):""}</textarea>
 <div class="actions"><button class="btn btn-primary" id="startInterview">${state.interviewStarted?"면담 다시 시작하기":"면담 시작하기"}</button></div>
 </div>
 <div class="card"><h2>이번 면담의 목적</h2><p>${esc(state.prepare.purpose||"아직 준비 단계에서 면담 목적을 정하지 않았어요.")}</p><p><span class="badge badge-blue">대상자</span> ${esc(state.prepare.target||p.name)}</p><p><span class="badge badge-purple">방식</span> ${esc(state.prepare.mode)}</p></div>
 </div>
 <div class="section card"><h2>가상 면담 대화</h2><div id="chat" class="chat">${chat.length?chat.map(m=>`<div class="msg ${m.role==="user"?"user":"ai"}">${m.role==="ai"?'<div class="chat-meta">가상 면담 대상자</div>':""}${esc(m.content)}</div>`).join(""):`<div class="center muted" style="margin:auto">면담을 시작하면 이곳에서 대화를 연습할 수 있어요.</div>`}</div>
 <div class="chat-input"><textarea id="chatInput" placeholder="직접 질문을 입력하세요. 추천 질문을 선택하지 않아도 괜찮아요." ${state.interviewStarted?"":"disabled"}></textarea><button class="btn btn-primary" id="sendChat" ${state.interviewStarted?"":"disabled"}>질문하기</button></div>
 <div id="chatFeedback"></div></div>

function bindAI(){
 document.querySelectorAll("[data-persona]").forEach(b=>b.onclick=()=>{state.persona=b.dataset.persona;save();render()});
 document.getElementById("startInterview")?.addEventListener("click",()=>{
   const opening=inputVal("#opening").trim();
   if(!opening){toast("면담을 여는 말을 먼저 적어 보세요.");return}
   state._opening=opening;state.interviewStarted=true;state.interviewDone=false;
   state.chat=[{role:"user",content:opening},{role:"ai",content:`안녕하세요. 저도 만나서 반가워요. ${personas[state.persona].intro} 가상의 면담 상황을 바탕으로 답변할게요. 녹음·녹화에 동의하는 상황이라면 이제 궁금한 점을 질문해 보세요.`}];
   save();render();scrollChat();
 });
 document.getElementById("sendChat")?.addEventListener("click",sendAI);
 document.getElementById("chatInput")?.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendAI()}});
}
function scrollChat(){setTimeout(()=>{const c=document.getElementById("chat");if(c)c.scrollTop=c.scrollHeight},30)}
function localAnswer(question){
 const p=personas[state.persona], q=question.toLowerCase();
 if(/앞으로|계획|목표|꿈|하고 싶|해 주고 싶은|당부/.test(q)) return p.future[Math.floor(Math.random()*p.future.length)];
 if(/생각|느낌|보람|힘들|마음|중요|이유|까닭/.test(q)) return p.feelings[Math.floor(Math.random()*p.feelings.length)];
 if(/어떻게|과정|무엇|어떤|하는 일|업무|준비|방법|언제|어디/.test(q)) return p.facts[Math.floor(Math.random()*p.facts.length)];
 return `${p.name}에 대해 궁금한 점을 잘 물어보았어요. 이 가상 면담에서는 ${p.intro.replace(/^도서관에서 일하며 /,"").replace(/^화재와 재난 현장에서 /,"")} 면담 목적과 관련해 더 구체적으로 질문해 보세요.`;
}
async function sendAI(){
 const input=document.getElementById("chatInput");const q=input?.value.trim();if(!q)return;
 const ev=evaluateQuestion(q);
 if(ev.kind!=="good"){
   state.chat.push({role:"user",content:q});state.chat.push({role:"ai",content:ev.text});save();render();scrollChat();return;
 }
 state.chat.push({role:"user",content:q});save();render();scrollChat();
 const chat=document.getElementById("chat");if(chat)chat.insertAdjacentHTML("beforeend",`<div class="msg ai" id="thinking"><div class="chat-meta">가상 면담 대상자</div>생각하고 있어요…</div>`);
 try{
   const systemPrompt=`너는 초등학교 6학년 국어 수업의 가상 면담 대상자다. 실제 인물인 척하지 말고, 선택된 직업의 일반적인 정보를 바탕으로 짧고 정확하게 답한다. 학생의 질문이 적절하면 답변만 자연스럽게 이어간다. 질문이 명백히 면담 목적에서 벗어나거나 민감하면 먼저 짧게 배려를 안내한다. 학생에게 교사처럼 평가하거나 혼내지 않는다. 후속 질문은 선택 사항이다. 대상 직업: ${personas[state.persona].name}. 면담 목적: ${state.prepare.purpose||"직업과 관련된 궁금한 점을 알아보기"}.`;
   const history=state.chat.slice(-8);
   const res=await fetch("https://interview-ai.jml5208.workers.dev/",{
     method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({message:q,history,systemPrompt})
   });
   if(!res.ok)throw new Error("AI proxy error");
   const data=await res.json();
   const answer=data.answer||data.message||data.content;
   if(!answer)throw new Error("empty");
   state.chat.push({role:"ai",content:answer});
 }catch(err){
   state.chat.push({role:"ai",content:`가상 면담 답변을 이어 갈게요. ${localAnswer(q)}\n\n이 답변에서 더 궁금한 점이 생겼다면 후속 질문을 해 보세요.`});
 }finally{
   state.interviewDone=true;save();render();scrollChat();
 }
}

 <div class="grid grid-2">
  <div><label>중요하게 알게 된 내용</label><textarea id="sumImportant">${esc(state.summary.important)}</textarea></div>
  <div><label>삭제 — 중요하지 않은 정보</label><textarea id="sumDelete">${esc(state.summary.delete)}</textarea></div>
  <div><label>대체 — 세부적인 내용을 일반적인 어휘로</label><textarea id="sumReplace">${esc(state.summary.replace)}</textarea></div>
  <div><label>선택 — 많은 내용 가운데 중요한 정보</label><textarea id="sumSelect">${esc(state.summary.select)}</textarea></div>
  <div class="full"><label>구성 — 명확하지 않은 내용을 일반적인 진술로 구성</label><textarea id="sumCompose">${esc(state.summary.compose)}</textarea></div>
 </div>
 <div class="callout" style="margin-top:15px"><b>정리의 네 가지 전략</b> · 삭제 · 대체 · 선택 · 구성</div>
 <div class="actions"><button class="btn btn-primary" id="saveSummary">정리 내용 저장하기</button></div></div>
 <div class="section card"><h2>매체를 활용할 때 기억해요</h2><ul><li>녹음·녹화를 할 때에는 먼저 면담 대상자의 동의를 구해요.</li><li>녹음·녹화한 자료를 허락 없이 인터넷에 올리거나 다른 사람에게 퍼뜨리지 않아요.</li><li>면담 목적에 맞는 자료를 찾아요.</li><li>자료의 출처가 믿을 만한지 살펴봐요.</li></ul></div>
 ${navButtons(state.stage-1,state.stage+1)}`;
}
function bindSummary(){
 const map={sumImportant:"summary.important",sumDelete:"summary.delete",sumReplace:"summary.replace",sumSelect:"summary.select",sumCompose:"summary.compose"};
 Object.entries(map).forEach(([id,path])=>document.getElementById(id)?.addEventListener("input",e=>updateField(path,e.target.value)));
 document.getElementById("saveSummary")?.addEventListener("click",()=>{complete("summary");toast("면담 정리 내용을 저장했어요.");render()});
}

function report(){
 return `<div class="card"><h2>면담 보고서 쓰기</h2><p class="muted">면담 보고서는 앞부분 → 가운데 부분 → 뒷부분으로 나누어 써 볼 수 있어요.</p>
 <div class="grid grid-3">
  <div class="report"><h4>앞부분</h4><p class="small">면담 목적 · 면담 대상자 · 면담 준비 과정</p><textarea id="repFront" placeholder="우리 모둠은 …을 알아보고자 …과 면담했습니다.">${esc(state.report.front)}</textarea></div>
  <div class="report"><h4>가운데 부분</h4><p class="small">면담으로 새롭게 안 사실 · 답변을 중심으로 중요한 내용 정리</p><textarea id="repMiddle" placeholder="면담으로 새롭게 안 사실은 …입니다.">${esc(state.report.middle)}</textarea></div>
  <div class="report"><h4>뒷부분</h4><p class="small">느낀 점 · 새롭게 생각하게 된 점 · 인상 깊었던 부분</p><textarea id="repBack" placeholder="면담을 하며 …을 알게 되었고, …하게 생각했습니다.">${esc(state.report.back)}</textarea></div>
 </div>
 <div class="actions"><button class="btn btn-primary" id="saveReport">보고서 저장하기</button></div></div>
 <div class="section card"><h2>쓰기 전에 확인</h2><div class="grid grid-3">
 ${["앞부분에 면담 목적·대상자·준비 과정이 드러나는가?","가운데 부분에 면담 대상자의 답변을 중심으로 중요한 내용을 정리했는가?","뒷부분에 면담하며 느낀 점이나 인상 깊었던 부분이 드러나는가?"].map(x=>`<div class="callout">✓ ${x}</div>`).join("")}</div></div>
 ${navButtons(state.stage-1,state.stage+1)}`;
}
function bindReport(){
 const map={repFront:"report.front",repMiddle:"report.middle",repBack:"report.back"};
 Object.entries(map).forEach(([id,path])=>document.getElementById(id)?.addEventListener("input",e=>updateField(path,e.target.value)));
 document.getElementById("saveReport")?.addEventListener("click",()=>{complete("report");toast("면담 보고서를 저장했어요.");render()});
}

function reflect(){
 const r=state.reflect;
 return `<div class="grid grid-2">
 <div class="card"><span class="badge badge-blue">나의 성찰</span><h2>내 면담 과정을 돌아봐요</h2>
 ${[["good","잘한 점"],["improve","보완할 점"],["more","더 알고 싶은 점"]].map(([k,l])=>`<div style="margin-top:13px"><label>${l}</label><textarea class="ref-mine" data-k="${k}">${esc(r.mine[k])}</textarea></div>`).join("")}</div>
 <div class="card"><span class="badge badge-green">우리 모둠의 성찰</span><h2>우리 모둠을 돌아봐요</h2>
 ${[["good","잘한 점"],["improve","보완할 점"],["next","다음 면담에서 실천할 점"]].map(([k,l])=>`<div style="margin-top:13px"><label>${l}</label><textarea class="ref-team" data-k="${k}">${esc(r.team[k])}</textarea></div>`).join("")}</div>
 </div>
 <div class="section card"><h2>면담 태도와 실천 정도</h2><p class="muted">지도서의 평가 관점을 따라 세 가지를 돌아봐요.</p>
 ${["면담 절차에 따라 자신이 맡은 역할을 잘 실천했나요?","예의를 지키며 면담 대상자의 답변을 경청했나요?","매체를 고려해 면담 목적에 맞는 정보를 수집하고 정리했나요?"].map((x,i)=>`<div class="check-row" style="margin-top:9px"><div style="flex:1"><b>${x}</b><div class="recommendations">${["보통임","잘함","매우 잘함"].map((v,j)=>`<button class="reco" data-rating="${i}" data-value="${j+1}" style="${r.ratings[i]===j+1?"outline:3px solid #a78bfa":""}">${v}</button>`).join("")}</div></div></div>`).join("")}
 <div class="actions"><button class="btn btn-primary" id="saveReflect">성찰 저장하기</button></div></div>
 ${navButtons(state.stage-1,state.stage+1)}`;
}
function bindReflect(){
 document.querySelectorAll(".ref-mine").forEach(e=>e.oninput=()=>{state.reflect.mine[e.dataset.k]=e.value;save()});
 document.querySelectorAll(".ref-team").forEach(e=>e.oninput=()=>{state.reflect.team[e.dataset.k]=e.value;save()});
 document.querySelectorAll("[data-rating]").forEach(e=>e.onclick=()=>{state.reflect.ratings[Number(e.dataset.rating)]=Number(e.dataset.value);save();render()});
 document.getElementById("saveReflect")?.addEventListener("click",()=>{complete("reflect");toast("성찰 내용을 저장했어요.");render()});
}

function review(){
 const qdone=quiz.every(q=>state.quiz[q.id]!==undefined);
 const score=quiz.filter(q=>state.quiz[q.id]===q.answer).length;
 const concepts=["면담은 특정 인물이나 주제의 정보를 수집하려고 주고받는 대화","면담에는 준비하기·진행하기·정리하기의 절차가 있음","질문은 구체적인 사실·생각이나 느낌·앞으로의 계획이나 당부로 나누어 볼 수 있음","면담 대상자를 배려하고 목적에 맞게 질문해야 함","면담 후 중요한 내용을 간추리고 과정을 성찰하며 보고서를 쓸 수 있음"];
 return `<div class="card center"><div style="font-size:64px">🧭</div><h2>탐험을 돌아봐요</h2><p>${qdone?"핵심 확인 문제까지 모두 살펴봤어요.":"아직 풀지 않은 핵심 확인 문제가 있어요. 그래도 배운 내용을 먼저 돌아볼 수 있어요."}</p><div class="summary-box"><b>핵심 확인 문제 ${score}/${quiz.length}</b></div></div>
 <div class="section grid grid-2"><div class="card"><h2>이번 단원에서 배운 것</h2><ul>${concepts.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="card"><h2>나에게 남은 질문</h2><textarea id="lastThought" placeholder="이번 탐험을 마치며 더 알고 싶은 점을 적어 보세요."></textarea><div class="actions"><button class="btn btn-primary" id="finish">전체 학습 완료하기</button></div></div></div>
 <div class="section card"><h2>면담의 핵심 흐름</h2><div class="callout"><b>무엇을 물어볼까?</b> → <b>누구에게 물어볼까?</b> → <b>어떻게 물어볼까?</b> → <b>무엇을 더 물어볼까?</b> → <b>무엇을 알게 되었을까?</b> → <b>어떻게 돌아볼까?</b></div></div>
 ${navButtons(state.stage-1,state.stage+1)}`;
}
function bindReview(){
 document.getElementById("finish")?.addEventListener("click",()=>{complete("review");toast("면담 탐험을 완료했어요!");render()});
}

function bindNavigation(){
 document.getElementById("prevBtn")?.addEventListener("click",()=>setStage(state.stage-1));
 const next=document.getElementById("nextBtn");
 next?.addEventListener("click",()=>{complete(stages[state.stage].id);setStage(state.stage+1)});
}

function bindStage(){
 if(state.stage===0){document.getElementById("startBtn")?.addEventListener("click",()=>setStage(pct()>0?state.stage+1:1));document.getElementById("meaningBtn")?.addEventListener("click",()=>setStage(1));}
 else{
  if(state.stage===1){bindQuiz(quiz[0]);bindQuiz(quiz[1]);bindQuiz(quiz[2])}
  if(state.stage===2){bindSort();bindQuiz(quiz[2])}
  if(state.stage===3)bindMake();
  if(state.stage===4)bindPrepare();
  if(state.stage===5)bindAI();
  if(state.stage===6)bindSummary();
  if(state.stage===7)bindReport();
  if(state.stage===8)bindReflect();
  if(state.stage===9){bindReview()}
  bindNavigation();
 }
}
const oldRender=render;
render=function(){oldRender();bindStage()};
render();
</script>
</body>
</html>
